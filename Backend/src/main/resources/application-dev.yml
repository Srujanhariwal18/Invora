spring:
  config:
    import: optional:file:.env[.properties]

  # ── DataSource ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # ── JPA ─────────────────────────────────────────────────────
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── Logging (verbose in dev) ──────────────────────────────────
logging:
  level:
    root: INFO
    com.invora: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
