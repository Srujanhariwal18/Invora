spring:
  # ── DataSource (all values MUST be provided as env vars in production) ──
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

  # ── JPA ─────────────────────────────────────────────────────
  jpa:
    show-sql: false

  # ── Flyway (strictly core migrations only, no dev seed) ──────
  flyway:
    locations: classpath:db/migration

# ── Server hardening ─────────────────────────────────────────
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

# ── Logging (minimal in production) ──────────────────────────
logging:
  level:
    root: WARN
    com.invora: INFO
    org.flywaydb: INFO

# ── JWT (MUST be provided as env var in production) ───────────
invora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
